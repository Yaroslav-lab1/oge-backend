name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: oge
          POSTGRES_USER: oge
          POSTGRES_PASSWORD: oge_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oge -d oge"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.12-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://oge:oge_ci_password@localhost:5432/oge
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-randomized-in-production-at-least-32-bytes
      METRICS_TOKEN: ci-only-metrics-token
      SEED_PASSWORD: CI-demo-password-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and format
        run: |
          ruff check app tests alembic scripts examples/kim/build_examples.py
          ruff format --check app tests alembic scripts examples/kim/build_examples.py
      - name: Type check
        run: mypy app scripts/seed.py alembic/env.py
      - name: Unit, integration, property and coverage gate for business logic
        run: >-
          python -m pytest -q
          --cov=app
          --cov-report=term --cov-report=xml:coverage.xml
          --cov-fail-under=80 --junitxml=junit.xml
      - name: Database migration round trip
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          python -m scripts.seed
          python -m scripts.seed
      - name: Generate and validate OpenAPI
        run: |
          python -m scripts.export_openapi
          python -m scripts.check_openapi
      - name: Compose configuration
        run: docker compose config -q
      - name: Dependency graph validation
        run: python -m pip check
      - name: Scan obvious secret formats
        run: |
          if git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|sk-[A-Za-z0-9]{20,}' -- . ':!*.zip'; then
            echo "Potential secret found" >&2
            exit 1
          fi
      - name: Install dependency vulnerability scanner
        run: python -m pip install pip-audit==2.10.1
      - name: Dependency vulnerability audit
        id: dependency_audit
        run: pip-audit -r requirements.txt --format=json --output=pip-audit.json
      - name: Report dependency findings
        if: steps.dependency_audit.outcome == 'failure'
        run: echo "Dependency audit reported findings; inspect pip-audit.json artifact" >&2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            junit.xml
            coverage.xml
            openapi.yaml
            pip-audit.json
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build multi-stage image
        run: docker build -t oge-backend:ci .
      - name: Verify non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' oge-backend:ci)" = "app"
      - name: Compose startup, restart persistence and backup restore
        run: bash scripts/ci_smoke.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test stack
        if: always()
        run: docker compose down -v
